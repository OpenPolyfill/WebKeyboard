<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom keyboard layouts</title><link rel="stylesheet" href="ui.css"></head>
<body><main class="editor"><h1>Custom keyboard layouts</h1><section aria-labelledby="inherit-heading"><h2 id="inherit-heading">Inherit an existing layout</h2><label for="inherit-source">Source layout</label><select id="inherit-source"><option value="">Select a layout…</option></select><button id="inherit" type="button">Inherit layout</button></section><form id="form"><input id="id" type="hidden"><label for="name">Name</label><input id="name" required maxlength="80" placeholder="My layout"><label for="data">Layout data (JSON: KeyboardEvent.code → output)</label><textarea id="data" required spellcheck="false" rows="14" placeholder='{"KeyA":"a","KeyB":"b"}'></textarea><div class="buttons"><button type="submit">Save layout</button><button id="clear" type="button">New layout</button></div></form><p id="status" role="status"></p><h2>Saved layouts</h2><ul id="list"></ul></main><script src="editor.js"></script></body></html>
