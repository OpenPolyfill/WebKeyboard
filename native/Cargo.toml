[package]
name = "webkeyboard-native-host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Firefox native messaging host for detecting the active keyboard layout"

[[bin]]
name = "webkeyboard-native-host"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
xkbcommon = "0.9.0"
x11 = { version = "2.21", features = ["xlib"] }
gtk = "0.18"
